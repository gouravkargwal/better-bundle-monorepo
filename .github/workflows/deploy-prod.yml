name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Services to deploy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - python-worker
          - remix-app
          - admin

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ubuntu
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /home/ubuntu/better-bundle-monorepo

            echo "=== Stashing local changes ==="
            git stash

            echo "=== Pulling latest code ==="
            git pull origin master

            SERVICE="${{ github.event.inputs.services }}"

            if [ "$SERVICE" = "all" ]; then
              echo "=== Building all custom services ==="
              docker compose -f docker-compose.prod.yml build remix-app python-worker admin

              echo "=== Restarting all services ==="
              docker compose -f docker-compose.prod.yml up -d
            else
              echo "=== Building $SERVICE ==="
              docker compose -f docker-compose.prod.yml build "$SERVICE"

              echo "=== Restarting $SERVICE ==="
              docker compose -f docker-compose.prod.yml up -d "$SERVICE"
            fi

            echo "=== Importing OpenObserve dashboards and alerts ==="
            # Always, regardless of which service was deployed: dashboards and
            # alerts describe the telemetry the code emits, so they have to move
            # with the code rather than be clicked in afterwards. import.py is
            # idempotent, so this updates in place instead of adding a copy per
            # deploy. `run --rm` rather than `up` because it is a one-shot job —
            # `up -d` on a service that exits immediately reads as a crash loop.
            docker compose -f docker-compose.prod.yml run --rm openobserve-import

            echo "=== Cleaning up old images ==="
            docker image prune -f

            echo "=== Waiting for services to stabilize ==="
            sleep 15

            echo "=== Container status ==="
            docker compose -f docker-compose.prod.yml ps

            echo "=== Deployment complete ==="
