# Learn more about configuring your checkout UI extension:
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/configuration

# The version of APIs your extension will receive. Learn more:
# https://shopify.dev/docs/api/usage/versioning
api_version = "2025-10"

[[extensions]]
name = "mercury"
handle = "mercury"
type = "ui_extension"
uid = "34e44979-d598-a499-7508-40b2e380a1c7d16d41bf"

# Controls where in Shopify your extension will be injected,
# and the file that contains your extension’s source code. Learn more:
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/extension-targets-overview

# Static targets only, so placement is automatic and cannot be duplicated.
#
# Both surfaces render directly after the cart lines: the block is shaped like
# a cart line, so that is where it belongs, and it is the one position that is
# contextual without sitting in the critical path. A dynamic
# `*.block.render` target was registered alongside these at first, for
# merchants who wanted it elsewhere — removed, because a dynamic block renders
# *in addition to* a static one. A merchant who dragged the block in would have
# got two copies of the widget, and two `offer_impressions` rows for every
# shopper, silently doubling the "offers shown" count the impact dashboard and
# the conversion rate are built on.
#
# Checkout — SHOPIFY PLUS ONLY, like every checkout-step target. The merchant
# would otherwise have had to drag the block somewhere, and the available
# drop zones are mostly wrong: between Contact and Delivery interrupts the
# form being filled in, and below "Pay now" is never seen.
[[extensions.targeting]]
module = "./src/Checkout.jsx"
target = "purchase.checkout.cart-line-list.render-after"

# Thank-you page — available on EVERY plan with no vaulted-card requirement,
# which makes it the widest-reach surface the app has. The dynamic block
# defaulted to rendering *above* the line items; this target puts it after
# them, matching checkout.
[[extensions.targeting]]
module = "./src/ThankYou.jsx"
target = "purchase.thank-you.cart-line-list.render-after"

[extensions.capabilities]
# Gives your extension access to directly query Shopify’s storefront API.
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/configuration#api-access
api_access = true

# Gives your extension access to make external network calls, using the
# JavaScript `fetch()` API. Learn more:
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/configuration#network-access
network_access = true

# Loads metafields on checkout resources, including the cart,
# products, customers, and more. Learn more:
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/configuration#metafields

# ✅ Mercury attribution tracking metafields (cart metafields become order metafields)
[[extensions.metafields]]
namespace = "bb_recommendation"
key = "extension"

[[extensions.metafields]]
namespace = "bb_recommendation"
key = "session_id"

[[extensions.metafields]]
namespace = "bb_recommendation"
key = "context"

[[extensions.metafields]]
namespace = "bb_recommendation"
key = "products"

[[extensions.metafields]]
namespace = "bb_recommendation"
key = "source"

# Defines settings that will be collected from merchants installing
# your extension. Learn more:
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/configuration#settings-definition

