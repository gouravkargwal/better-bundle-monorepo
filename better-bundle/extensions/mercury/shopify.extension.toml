# Learn more about configuring your checkout UI extension:
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/configuration

# The version of APIs your extension will receive. Learn more:
# https://shopify.dev/docs/api/usage/versioning
api_version = "2025-10"

[[extensions]]
name = "mercury"
handle = "mercury"
type = "ui_extension"
uid = "34e44979-d598-a499-7508-40b2e380a1c7d16d41bf"

# Controls where in Shopify your extension will be injected,
# and the file that contains your extension’s source code. Learn more:
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/extension-targets-overview

# Checkout: a STATIC target in the main content column.
#
# Two separate problems had to be solved together here.
#
# 1. This was `purchase.checkout.cart-line-list.render-after`, which renders
#    inside the order summary. Shopify classifies every ORDER_SUMMARY placement
#    as hidden on mobile, because that column collapses behind "Show order
#    summary" — so the widget was invisible to most mobile shoppers while still
#    writing an impression row for each of them.
#
# 2. The obvious fix, the dynamic `purchase.checkout.block.render` target with
#    `default_placement = "PAYMENT1"`, is a trap. `default_placement` only
#    "recommends an initial placement to merchants in the checkout editor" — the
#    merchant still has to go in and add the block before anything renders. That
#    is a permanent onboarding step, not a one-off migration: every merchant who
#    ever installs the app would open checkout, see nothing, and have to be told
#    to go configure it. A static target means install-and-it-works.
#
# `payment-method-list.render-before` is static, so it renders with no merchant
# action and cannot be duplicated, AND it sits in the main content column between
# the payment heading and the payment methods — the same position PAYMENT1 offers,
# without the activation requirement. It is the one option that fixes the mobile
# visibility without asking anything of the merchant.
#
# Why this position: by the payment step the shopper has settled items, address
# and shipping, so an add-on is one tap rather than a reconsideration. The old
# comment here rejected "between Contact and Delivery" for interrupting the form
# being filled in, and that reasoning still holds — this is after all the form
# work is done.
#
# SHOPIFY PLUS ONLY, like every checkout-step target.
[[extensions.targeting]]
module = "./src/Checkout.jsx"
target = "purchase.checkout.payment-method-list.render-before"

# Thank-you page — available on EVERY plan with no vaulted-card requirement,
# which makes it the widest-reach surface the app has.
#
# `customer-information.render-after`, not `cart-line-list.render-after`. The
# latter renders inside the order summary, which collapses on mobile exactly as
# it does in checkout — so the app's widest-reach surface was invisible to most
# of the shoppers it reached, while still writing an impression for each of them.
# This target is static (no merchant action, cannot be duplicated) and sits in
# the main content column, after the contact, shipping and payment details.
#
# Why after the order details rather than `header.render-after`, which is higher
# up and would be seen by more people: someone who has just paid wants to
# confirm what they bought before being shown anything else. Recommendations
# above the order facts read as a store that cares more about the next sale than
# the one just made. If that trade turns out to be worth making, this is a
# one-line change — `header.render-after` and `footer.render-after` are the other
# two static main-column options.
[[extensions.targeting]]
module = "./src/ThankYou.jsx"
target = "purchase.thank-you.customer-information.render-after"

[extensions.capabilities]
# Gives your extension access to directly query Shopify’s storefront API.
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/configuration#api-access
api_access = true

# Gives your extension access to make external network calls, using the
# JavaScript `fetch()` API. Learn more:
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/configuration#network-access
network_access = true

# Loads metafields on checkout resources, including the cart,
# products, customers, and more. Learn more:
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/configuration#metafields

# ✅ Mercury attribution tracking metafields (cart metafields become order metafields)
[[extensions.metafields]]
namespace = "bb_recommendation"
key = "extension"

[[extensions.metafields]]
namespace = "bb_recommendation"
key = "session_id"

[[extensions.metafields]]
namespace = "bb_recommendation"
key = "context"

[[extensions.metafields]]
namespace = "bb_recommendation"
key = "products"

[[extensions.metafields]]
namespace = "bb_recommendation"
key = "source"

