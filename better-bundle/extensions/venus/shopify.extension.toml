# Customer account UI extension.
# https://shopify.dev/docs/api/customer-account-ui-extensions/latest/configuration

api_version = "2025-07"

[[extensions]]
name = "venus"
handle = "venus"
type = "ui_extension"
uid = "883039ef-d1b1-d011-d986-bea48c7c43777e121c7c"

# Order Status page only.
#
# This page is what every shipping-confirmation email links to, so customers
# return to it repeatedly while waiting on delivery — real, repeat traffic, and
# available on every Shopify plan.
#
# The Profile and Order Index targets were removed: customer-account profile
# and order-list traffic is negligible on most stores, so they cost review
# surface and support for almost no impressions.
[[extensions.targeting]]
module = "./src/OrderStatusBlock.tsx"
target = "customer-account.order-status.block.render"

[extensions.capabilities]
api_access = true
network_access = true
