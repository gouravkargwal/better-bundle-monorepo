services:
  # ==================== DATABASE ====================
  postgres:
    # pgvector build of Postgres 17. The plain postgres:17 image has no
    # `vector` type, so product_vectors cannot be created on it. Same PG
    # major version, so an existing data volume stays compatible.
    image: pgvector/pgvector:pg17
    container_name: betterbundle-postgres-dev
    env_file:
      - .env.dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=postgres,env=dev"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== KAFKA ====================
  kafka_b:
    # apache/kafka, not confluentinc/cp-kafka: 626MB against 1.74GB for the
    # same KRaft broker. The Confluent image carries Schema Registry hooks,
    # Connect plumbing and the Confluent CLI suite, none of which this stack
    # uses. Config is unchanged -- both images read the same KAFKA_* env vars.
    #
    # user: root because neither the image nor Docker pre-creates the data
    # directory, so a fresh named volume is root-owned and the broker dies with
    # AccessDeniedException on meta.properties. Confluent's image shipped a
    # chown in its entrypoint; this one does not.
    #
    # The data path moved to /opt/kafka/data only because that is where this
    # image's own directory lives. A named volume mounts its root wherever you
    # point it, so kafka_data keeps its contents: verified on the dev volume,
    # which came up "already formatted", recovered __cluster_metadata at offset
    # 693297 and kept all nine topics. No wipe, no resync.
    image: apache/kafka:3.9.1
    container_name: kafka_b_dev
    user: root
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/opt/kafka/data
    env_file:
      - .env.dev
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka_b:9093,PLAINTEXT_HOST://localhost:9092
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka_b:29093
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9093,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LOG_DIRS=/opt/kafka/data
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=kafka,env=dev"
    # A TCP probe, NOT `kafka-broker-api-versions` -- matching dev and prod.
    # Two reasons: that script is not on PATH in apache/kafka (it lives in
    # /opt/kafka/bin), and it boots a whole second JVM to ask the broker one
    # question, which measured 5.2-32.3s per run on dev against a 30s interval.
    # `/dev/tcp` is a bash builtin, so this costs no process at all.
    #
    # Honest limitation: this proves the listener is bound, not that the broker
    # is serving metadata. Kafka binds 9092 late in startup, so it is a good
    # proxy; `start_period` covers the gap.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9092'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ==================== KAFKA UI ====================
  kafka-ui:
    container_name: kafka-ui-dev
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka_b
    ports:
      - "8080:8080"
    env_file:
      - .env.dev
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kafka-kraft
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka_b:9093
      DYNAMIC_CONFIG_ENABLED: "true"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
        labels: "service=kafka-ui,env=dev"
  # ==================== REDIS ====================
  redis:
    image: redis/redis-stack:7.2.0-v18
    container_name: betterbundle-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "8002:8001"
    volumes:
      - redis_data:/data
    env_file:
      - .env.dev
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=redis,env=dev"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5



  # ── OpenObserve (local mode — SQLite, no MinIO) ─────
  openobserve:
    image: openobserve/openobserve:latest
    container_name: betterbundle-openobserve
    environment:
      - ZO_ROOT_USER_EMAIL=admin@betterbundle.io
      - ZO_ROOT_USER_PASSWORD=admin
      - ZO_DATA_DIR=/data
      - ZO_LOCAL_MODE=true
      # Local throwaway stack: a week is plenty, and it keeps the dev
      # machine's disk out of it.
      - ZO_COMPACT_DATA_RETENTION_DAYS=7
    ports:
      - "5080:5080"
    volumes:
      - openobserve_data:/data
    networks:
      - betterbundle-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/openobserve", "node", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s


  # ── OpenObserve config import ────────────────────────
  # One-shot: brings the dashboards, alerts and destinations in this repo into
  # OpenObserve on every `up`, so observability config is deployed with the code
  # that emits the telemetry rather than clicked in by hand afterwards.
  #
  # It exits as soon as it is done — `docker compose ps` showing it stopped is
  # success, not a crash. import.py is idempotent, so repeated runs update in
  # place instead of piling up copies.
  openobserve-import:
    image: python:3.12-alpine
    container_name: betterbundle-openobserve-import
    depends_on:
      openobserve:
        condition: service_healthy
    environment:
      # Derived from this file's own ZO_ROOT_USER_* values above — the local
      # stack has no .env, and OpenObserve's API key is just basic auth. Local
      # throwaway credentials, already in plaintext a few lines up.
      - OPENOBSERVE_API_KEY=YWRtaW5AYmV0dGVyYnVuZGxlLmlvOmFkbWlu
      - SLACK_WEBHOOK_URL=https://hooks.slack.com/services/LOCAL/NO/OP
    volumes:
      - ./openobserve-config:/config:ro
    # Waits for OpenObserve to answer before importing; see wait_for() in the script.
    command: python /config/import.py http://openobserve:5080
    restart: "no"
    networks:
      - betterbundle-network

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  openobserve_data:

networks:
  betterbundle-network:
    driver: bridge
