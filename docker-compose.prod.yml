networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: false

services:
  # ==================== REMIX APPLICATION ====================
  remix-app:
    build:
      context: ./better-bundle
      dockerfile: Dockerfile.prod
    container_name: betterbundle-remix
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.prod
    networks:
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      python-worker:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          # 512M -> 1G. Node SSR plus a Prisma client is tight in 512M, and the
          # cost of being wrong is an OOM-kill of the merchant-facing app.
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,container"

  # ==================== DATABASES ====================
  postgres:
    # pgvector build of Postgres 17. The plain postgres:17 image has no
    # `vector` type, so product_vectors cannot be created on it. Same PG
    # major version, so an existing data volume stays compatible.
    image: pgvector/pgvector:pg17
    container_name: betterbundle-postgres
    env_file:
      - .env.prod
    # Raising the memory limit below does nothing on its own: Postgres ships
    # with shared_buffers=128MB and ignores the cgroup entirely, so a 3G
    # container would still plan and cache as if it had 128MB.
    #
    #   shared_buffers        25% of the container, the usual starting point.
    #   effective_cache_size  not an allocation — it tells the planner how much
    #                         OS page cache to assume. The default is 4GB, which
    #                         was a lie at 512M and made the planner favour seq
    #                         scans over index scans.
    #   work_mem              per sort/hash, per connection. 8MB x 100 max
    #                         connections is 800MB worst case, which fits.
    #   maintenance_work_mem  index builds — pgvector HNSW builds are hungry.
    command:
      - postgres
      - -c
      - shared_buffers=768MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=256MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - frontend
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          # 512M -> 3G. This is the data path — pgvector similarity search,
          # product_edges, order_data, every attribution query — and it had less
          # memory than Kafka. Memory limits hard-kill where CPU limits only
          # throttle, so this was the most likely thing to take the box down.
          # 5.9G of the 12G was unallocated, so it costs nothing.
          memory: 3G
        reservations:
          cpus: "0.5"
          memory: 1G
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,container"

  redis:
    image: redis/redis-stack:7.2.0-v18
    container_name: betterbundle-redis
    env_file:
      - .env.prod
    ports:
      - "6379:6379"
      - "8002:8001"
    volumes:
      - redis_data:/data
    networks:
      - backend
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --appendfsync everysec --maxmemory 384mb --maxmemory-policy allkeys-lru --protected-mode yes --requirepass "$$REDIS_PASSWORD" --loadmodule /opt/redis-stack/lib/redisearch.so --loadmodule /opt/redis-stack/lib/rejson.so --loadmodule /opt/redis-stack/lib/redistimeseries.so
        else
          exec redis-server --appendonly yes --appendfsync everysec --maxmemory 384mb --maxmemory-policy allkeys-lru --protected-mode yes --loadmodule /opt/redis-stack/lib/redisearch.so --loadmodule /opt/redis-stack/lib/rejson.so --loadmodule /opt/redis-stack/lib/redistimeseries.so
        fi
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping; else redis-cli ping; fi',
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,container"

  # ==================== KAFKA CLUSTER ====================
  kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: betterbundle-kafka
    env_file:
      - .env.prod
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # 1, not the stock 50. On the dev cluster `__consumer_offsets` was 50 of
      # 56 total partitions — 89% of everything — against six partitions of
      # actual business topics. Each partition costs log segments, indexes,
      # timer tasks and periodic log-cleaner compaction, which matters more here
      # than on dev because this broker is capped at half a core.
      #
      # Single broker (KAFKA_NODE_ID 1, quorum 1@kafka:29093), so one partition
      # loses no redundancy that RF 1 was not already giving up.
      #
      # Only applied when the cluster is first created. If this broker has
      # already run, its kafka_data volume keeps 50 partitions until wiped —
      # so treat this as correct-for-next-rebuild, not an immediate saving.
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LOG4J_LOGGERS: "kafka.controller=WARN,kafka.producer.async.DefaultEventHandler=WARN,state.change.logger=WARN"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx1g"
    networks:
      - backend
    restart: unless-stopped
    # A TCP probe, NOT `kafka-broker-api-versions`.
    #
    # That script boots a second JVM (256M heap, the Kafka CLI default) just to
    # ask the broker one question. On dev it measured 5.2-32.3s per run, mean
    # 12.7s against a 30s interval, burning 1.5-2.5 cores on JIT compilation it
    # then discards.
    #
    # It is worse here than on dev, because this service is capped at 1.0 CPU
    # below. A JVM that wants two cores and is given one takes proportionally
    # longer, so the 10s timeout was likely to fail routinely — and with
    # `retries: 5` a run of failures marks the broker unhealthy, which takes
    # down everything with `depends_on: kafka/condition: service_healthy`
    # (the Remix app and kafka-ui). A healthcheck that can fail the service it
    # is checking, purely by being expensive, is worse than no healthcheck.
    #
    # `/dev/tcp` is a bash builtin, so this costs no process at all.
    #
    # Honest limitation: this proves the listener is bound, not that the broker
    # is serving metadata. Kafka binds 9092 late in startup — after log
    # recovery — so it is a good proxy, but weaker than what it replaces.
    # `start_period` is raised to 90s because recovery over a real production
    # log directory takes considerably longer than over an empty dev volume.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9092'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          # 1.0 -> 0.5. A single broker that has carried ~1,200 messages in this
          # project's lifetime does not need half of a two-core box.
          cpus: "0.5"
          # 1536M -> 2G. A JVM needs roughly 1.3-1.5x its heap once metaspace,
          # code cache, thread stacks and the direct byte buffers Kafka uses for
          # network I/O are counted. -Xmx1g inside 1536M was close enough to the
          # edge to get OOM-killed under load, and a killed broker means log
          # recovery on restart — which genuinely does burn CPU.
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 768M
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,container"

  kafka-ui:
    # Opt-in only: `docker compose --profile debug up kafka-ui`.
    #
    # A Spring Boot app held 0.5 CPU and 512M permanently — a quarter of a
    # two-core box — to serve a UI opened a handful of times a month. With a
    # profile it is absent from a normal `up` and costs nothing until asked for.
    profiles: ["debug"]
    container_name: betterbundle-kafka-ui
    image: provectuslabs/kafka-ui:latest
    env_file:
      - .env.prod
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: production-kafka-kraft
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
      AUTH_TYPE: "DISABLED"
      JAVA_OPTS: "-Xms128m -Xmx256m"
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"



  # ==================== PYTHON WORKER ====================
  python-worker:
    build:
      context: ./python-worker
      dockerfile: Dockerfile.prod
    container_name: betterbundle-python-worker
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env.prod
    volumes:
      # Vertex AI service-account credentials (AI_PROVIDER=vertex), referenced by
      # GOOGLE_APPLICATION_CREDENTIALS in .env.prod. Place the real key file at
      # ./.secrets/gcp-service-account.json (gitignored, not checked in).
      - ./.secrets/gcp-service-account.json:/etc/gcp/service-account.json:ro
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # The measured bottleneck: under load this pegs at 95% CPU while
          # Postgres sits at 11%, and serving throughput flatlines at ~17 req/s
          # no matter the concurrency. It had the same CPU share as a debugging
          # UI. Note Dockerfile.prod runs `uvicorn --workers 4` — four processes
          # inside a 1.0 cap were contending for one core and gaining nothing.
          cpus: "1.25"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,container"

  # ==================== DJANGO ADMIN (BACKOFFICE) ====================
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: betterbundle-admin
    ports:
      - "127.0.0.1:8003:8000"
    env_file:
      - .env.prod
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    networks:
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c ''import urllib.request; urllib.request.urlopen("http://localhost:8000/")'' || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          # 0.5 -> 0.25. A low-traffic internal console does not need a quarter of the box.
          cpus: "0.25"
          memory: 384M
        reservations:
          cpus: "0.25"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,container"

  # ==================== NGINX PROXY MANAGER ====================
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: betterbundle-nginx-proxy
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - frontend
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # 0.5 -> 0.25. A reverse proxy at this request volume is nearly idle; it needs headroom for TLS bursts, not a fixed quarter-box.
          cpus: "0.25"
          memory: 384M
        reservations:
          cpus: "0.25"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── OpenObserve (production — uses AWS S3 natively) ──
  openobserve:
    image: openobserve/openobserve:latest
    container_name: betterbundle-openobserve
    env_file:
      - .env.prod
    environment:
      - ZO_ROOT_USER_EMAIL=admin@betterbundle.io
      - ZO_ROOT_USER_PASSWORD=${OPENOBSERVE_ADMIN_PASSWORD}
      # Local disk, same as dev — one storage path to reason about instead of
      # two, and no AWS account or egress in the loop. Logs live on the
      # `openobserve_data` volume, so that volume is now the only copy: it
      # needs to be in the block-volume backup set.
      - ZO_DATA_DIR=/data
      - ZO_LOCAL_MODE=true
      - ZO_TELEMETRY=false
    ports:
      - "127.0.0.1:5080:5080"
    volumes:
      - openobserve_data:/data
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # 1.0 -> 0.5. Half of a two-core box for log storage is more than the
          # product itself was getting. Still self-hosted, and still competing
          # with serving for CPU — moving it to a hosted collector would recover
          # this entirely, which is the larger decision left open.
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  npm_data:
  npm_letsencrypt:
  openobserve_data:
