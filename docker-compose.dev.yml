# Memory budget for this stack.
#
# Every service carries a mem_limit because without them the kernel, under
# pressure, kills whatever process is largest anywhere on the host. That is not
# the process at fault: a runaway worker took out the host and the symptom was
# Remix reporting Postgres unreachable, which sends you looking in the wrong
# place entirely. With limits, an overrun is contained to the container that
# caused it.
#
#   python-worker   1200m   needs real headroom: catalog sweeps, embedding runs
#   openobserve      900m   sizes its own caches from this limit, so a tight
#                           value does not just slow it down, it crash-loops it
#   kafka_b          700m   512m JVM heap + non-heap overhead
#   postgres         700m   256m shared_buffers + 8m work_mem x pool, + cache
#   redis            160m   cache only
#   ------------------------
#   total           3660m   against a ~3.8GB Docker VM, leaving ~260m for the
#                           host and the daemon
#
# Limits are ceilings, not reservations, so nothing is consumed until a service
# asks for it. The point is isolation: without them the kernel, under pressure,
# kills whatever process is largest anywhere on the host — which is not
# necessarily the one at fault. A runaway worker took the whole VM down and the
# visible symptom was Remix reporting Postgres unreachable, which sends you
# looking in entirely the wrong place.
#
# Do not shave these to fit another service in. Set one too low and it
# crash-loops rather than running slowly, which is worse than no limit at all.
# memswap_limit equals mem_limit throughout so nothing swaps its way past the
# ceiling and degrades invisibly instead of failing where you can see it.
services:
  # ==================== DATABASE ====================
  postgres:
    # pgvector build of Postgres 17. The plain postgres:17 image has no
    # `vector` type, so product_vectors cannot be created on it. Same PG
    # major version, so an existing data volume stays compatible.
    image: pgvector/pgvector:pg17
    container_name: betterbundle-postgres-dev
    env_file:
      - .env.dev
    # Same knobs as prod, a third of the values — this Docker VM has ~2.8GB
    # total for every container, where prod has 12GB. Stock Postgres plans with
    # shared_buffers=128MB and an effective_cache_size of 4GB regardless of what
    # it actually has, so without this the dev planner makes different choices
    # from the prod one and a query plan verified here proves nothing about
    # there. Matching the shape is the point; matching the numbers would not fit.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    # Ceiling, not a reservation — it only bites when a container misbehaves.
    # Without limits anywhere, one runaway service exhausts the whole ~2.8GB VM
    # and the kernel picks a victim by size, which is how a memory leak in the
    # worker took the host down and made Postgres look unreachable from Remix.
    # 256MB shared_buffers, plus 8MB work_mem per connection across a pool of
    # 20, is already ~420MB before a single page of cache. At 450m this sat
    # pinned against its ceiling, reclaiming page cache constantly to stay
    # under — which does not crash, it just makes every query slower with
    # nothing obvious to point at.
    mem_limit: 700m
    memswap_limit: 700m  # equal to mem_limit: no swap to hide the overrun
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=postgres,env=dev"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== KAFKA ====================
  kafka_b:
    # apache/kafka, not confluentinc/cp-kafka: 626MB against 1.74GB for the
    # same KRaft broker. The Confluent image carries Schema Registry hooks,
    # Connect plumbing and the Confluent CLI suite, none of which this stack
    # uses. Config is unchanged -- both images read the same KAFKA_* env vars.
    #
    # user: root because neither the image nor Docker pre-creates the data
    # directory, so a fresh named volume is root-owned and the broker dies with
    # AccessDeniedException on meta.properties. Confluent's image shipped a
    # chown in its entrypoint; this one does not.
    #
    # The data path moved to /opt/kafka/data only because that is where this
    # image's own directory lives. A named volume mounts its root wherever you
    # point it, so kafka_data keeps its contents: verified on the dev volume,
    # which came up "already formatted", recovered __cluster_metadata at offset
    # 693297 and kept all nine topics. No wipe, no resync.
    image: apache/kafka:3.9.1
    container_name: kafka_b_dev
    user: root
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/opt/kafka/data
    env_file:
      - .env.dev
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka_b:9093,PLAINTEXT_HOST://localhost:9092
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka_b:29093
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9093,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LOG_DIRS=/opt/kafka/data
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      # 1, not the stock 50. `__consumer_offsets` accounted for 50 of the 56
      # partitions on this cluster — 89% of all partitions, for six partitions
      # of actual business topics. Each one carries log segments, indexes, timer
      # tasks and periodic log-cleaner compaction, which is the background CPU
      # floor on an otherwise empty broker.
      #
      # Only applied when the cluster is first created, so an existing
      # kafka_data volume keeps its 50 until the volume is wiped.
      - KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      # Dev does not need the 1G default. Resident was 944MB against a 1G heap —
      # a third of the whole Docker allocation, more than every other container
      # combined. Prod keeps 1g; see docker-compose.prod.yml.
      - KAFKA_HEAP_OPTS=-Xms256m -Xmx512m
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    restart: unless-stopped
    # Heap is capped at 512m above; this leaves room for the JVM's non-heap
    # usage (metaspace, direct buffers, thread stacks) on top of it. Set below
    # the heap cap the JVM would die in confusing ways instead of throwing
    # OutOfMemoryError.
    mem_limit: 700m
    memswap_limit: 700m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=kafka,env=dev"
    # A TCP probe, NOT `kafka-broker-api-versions`.
    #
    # That script boots a whole second JVM (256M heap, the Kafka CLI default)
    # to ask the broker one question, then throws the JIT-compiled result away.
    # Measured here: 5.2-32.3s per run, mean 12.7s, against a 30s interval —
    # a ~42% duty cycle of a throwaway JVM burning 1.5-2.5 cores on C1/C2
    # compilation. That, not Kafka, was the 244% CPU. Two of five runs also
    # exceeded the 10s timeout, so the container flapped between healthy and
    # unhealthy and anything waiting on `service_healthy` flapped with it.
    #
    # `/dev/tcp` is a bash builtin, so this costs no process at all.
    #
    # Honest limitation: this proves the listener is bound, not that the broker
    # is serving metadata. Kafka binds 9092 late in startup — after log
    # recovery — so it is a good proxy, but it is a weaker check than the one it
    # replaces. `start_period` covers the gap.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9092'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ==================== REDIS ====================
  redis:
    image: redis/redis-stack:7.2.0-v18
    container_name: betterbundle-redis-dev
    restart: unless-stopped
    # Redis is used as a cache here (permissions, shop lookups), so it holds
    # little. The limit is what stops an unbounded key set from quietly
    # becoming the largest process on the host.
    mem_limit: 160m
    memswap_limit: 160m
    ports:
      - "6379:6379"
      - "8002:8001"
    volumes:
      - redis_data:/data
    env_file:
      - .env.dev
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=redis,env=dev"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==================== PYTHON WORKER ====================
  python-worker:
    build:
      context: ./python-worker
      dockerfile: Dockerfile.dev
    container_name: betterbundle-python-worker-dev
    ports:
      - "8000:8000"
    environment:
      # Emit the STABLE http semantic conventions:
      # http.server.request.duration (seconds) rather than the older
      # http.server.duration (milliseconds). Without this the metric names in
      # OpenObserve are the pre-1.23 ones, which no off-the-shelf dashboard or
      # runbook is written against.
      - OTEL_SEMCONV_STABILITY_OPT_IN=http
    env_file:
      - .env.dev
    volumes:
      - ./python-worker:/app
      - /app/__pycache__
      - ./.secrets/gcp-service-account.json:/etc/gcp/service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka_b:
        condition: service_healthy
      openobserve:
        condition: service_healthy
    restart: unless-stopped
    # The largest ceiling, because this is the process that legitimately needs
    # headroom: a catalog sweep and an embedding run both hold real data. It is
    # also the one that has actually run away — twice — and with no limit the
    # kernel killed by size across the whole host, so Postgres and Kafka were
    # collateral and Remix reported the database as unreachable. With a limit
    # the overrun stays inside this container.
    mem_limit: 1200m
    memswap_limit: 1200m
    # Reap zombies. uvicorn --reload is PID 1 here, and when its child was
    # OOM-killed the dead process was left unreaped; an init process cleans
    # those up instead of accumulating them.
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=python-worker,env=dev"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  # ── OpenObserve ──────────────────────────────────────
  openobserve:
    image: openobserve/openobserve:latest
    container_name: betterbundle-openobserve
    env_file:
      - .env.dev
    environment:
      # Local disk only. The previous S3 block pointed at a MinIO container,
      # which was redundant next to ZO_LOCAL_MODE and cost a whole service.
      - ZO_DATA_DIR=/data
      - ZO_LOCAL_MODE=true
      - ZO_TELEMETRY=false
      # Retention. Without this OpenObserve keeps data for its default 3650
      # days, i.e. forever, on a local disk volume. Trace volume measured at
      # ~41k spans/day is harmless per day and 15M/year is not; the dashboards
      # and alerts all query windows of minutes to 24h, so nothing reads past
      # a fortnight. Traces are the bulk and expire first.
      - ZO_COMPACT_DATA_RETENTION_DAYS=30
    ports:
      - "5080:5080"
    volumes:
      - openobserve_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/openobserve", "node", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Observability must never be the reason the thing it observes goes down —
    # but it must not be starved into a crash loop either. 300m put this into
    # one: OOM-killed on ingest, restarted, killed again, taking the cost
    # dashboard down with it. A single-node OpenObserve indexing metrics and
    # logs needs headroom well past its idle footprint.
    mem_limit: 900m
    memswap_limit: 900m


  # ── OpenObserve config import ────────────────────────
  # One-shot: brings the dashboards, alerts and destinations in this repo into
  # OpenObserve on every `up`, so observability config is deployed with the code
  # that emits the telemetry rather than clicked in by hand afterwards.
  #
  # It exits as soon as it is done — `docker compose ps` showing it stopped is
  # success, not a crash. import.py is idempotent, so repeated runs update in
  # place instead of piling up copies.
  openobserve-import:
    image: python:3.12-alpine
    container_name: betterbundle-openobserve-import
    depends_on:
      - openobserve
    env_file:
      - .env.dev
    volumes:
      - ./openobserve-config:/config:ro
    # Waits for OpenObserve to answer before importing; see wait_for() in the script.
    command: python /config/import.py http://openobserve:5080
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  openobserve_data:
